# --- 保留 Debug 和 Temps 设置 ---
debug=1
save-temps=1

[connectivity]
# --- 计算单元定义 ---
nk=gemv_kernel:1:gemv_kernel_1

# --- SLR 分配 ---

# --- HBM 映射 ---
# 激活输入映射到 HBM[1]
sp=gemv_kernel_1.act_packed:HBM[1]

# 输出映射到 HBM[2]
sp=gemv_kernel_1.output:HBM[2]

# 32个权重列分别映射到 HBM
sp=gemv_kernel_1.weight_col0:HBM[0]
