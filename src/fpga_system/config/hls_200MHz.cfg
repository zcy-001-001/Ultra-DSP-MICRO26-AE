# Single-run Vitis HLS configuration for the 200 MHz review artifact.

freqhz=200000000

[hls]
flow_target=vitis
package.output.format=xo
package.output.syn=1

max_thread=16
jobs=16
hls.jobs=16
vivado.syn.jobs=16

syn.top=gemv_kernel
syn.file=../src/GEMV.cpp
syn.file=../src/GEMV.h
syn.file=../src/Hybrid_INT4_INT4_PD.v
syn.blackbox.file=../src/Hybrid_INT4_INT4_PD.json
